[platformio]
src_dir = .
include_dir = src
core_dir = D:\.pio_core

[env:esp32c3]
platform = espressif32
board = esp32-c3-devkitm-1
framework = arduino
build_src_filter = 
    +<*.ino*>
    +<src/>
    -<build/>
    -<tools/>
board_build.partitions = partitions.csv
board_build.f_cpu = 160000000L      ; Maximize CPU clock to 160 MHz
board_build.f_flash = 80000000L    ; Double flash bus clock to 80 MHz
board_build.flash_mode = qio        ; Quad I/O (4-bit data bus) instead of Dual
build_flags = 
    -Isrc
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -O2                             ; Compiler speed optimization for audio/DSP
lib_deps = 
    adafruit/Adafruit SSD1306@^2.5.9
    adafruit/Adafruit GFX Library@^1.11.9
    adafruit/Adafruit BusIO@^1.15.0
